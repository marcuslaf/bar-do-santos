version: '3.8'

services:  supabase:
    image: supabase/supabase:latest
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET nao definido - copie .env.example para .env}
      ANON_KEY: ${ANON_KEY:?ANON_KEY nao definido}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?SERVICE_ROLE_KEY nao definido}
    ports:
      - "54321:54321"
      - "54322:54322"
      - "54323:54323"
      - "54324:54324"
      - "54325:54325"
    volumes:
      - supabase_data:/var/lib/postgresql/data
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:3001
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/restaurante_pedidos
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET nao definido - veja .env.example}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - /app/node_modules
volumes:
  postgres_data:  supabase_data:
