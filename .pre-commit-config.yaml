# ============================================
# Pre-commit hooks de segurança
# Instale com: pip install pre-commit && pre-commit install
# ============================================

repos:
  # === Detectar secrets em código ===
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  # === Verificar .env não commitado ===
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=1000']

  # === Verificar npm audit ===
  - repo: local
    hooks:
      - id: npm-audit
        name: npm audit
        entry: bash -c 'if [ -f package.json ]; then npm audit --audit-level=high; fi'
        language: system
        pass_filenames: false

  # === Verificar secrets patterns ===
  - repo: local
    hooks:
      - id: grep-secrets
        name: Check for hardcoded secrets
        entry: |
          bash -c '
            patterns=(
              "AKIA[0-9A-Z]{16}"
              "sk_live_[0-9a-zA-Z]{24,}"
              "sk_test_[0-9a-zA-Z]{24,}"
              "ghp_[0-9a-zA-Z]{36}"
              "xox[bpsa]-[0-9a-zA-Z]{10,}"
              "eyJ[A-Za-z0-9-_]+\.eyJ[A-Za-z0-9-_]+\.[A-Za-z0-9-_.+/=]*"
              "password\s*[:=]\s*['\"][^'\"]+['\"]"
              "secret\s*[:=]\s*['\"][^'\"]+['\"]"
            )
            for pattern in "${patterns[@]}"; do
              if grep -rE "$pattern" --include="*.{ts,tsx,js,jsx,py,java,go,rs,cs}" . 2>/dev/null; then
                echo "❌ Potential secret detected with pattern: $pattern"
                echo "   Remove hardcoded secrets and use environment variables."
                exit 1
              fi
            done
          '
        language: system
        pass_filenames: false
