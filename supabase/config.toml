# Config local do Supabase CLI (supabase start / db reset).
# Mantido mínimo de propósito: chaves omitidas usam o default do CLI.
project_id = "bar-do-santos"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Hosted Supabase roda Postgres 17; manter o local igual evita drift de comportamento.
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Logs locais (vector + logflare) desligados: no Docker Desktop o container
# vector aponta para DOCKER_HOST=http://host.docker.internal:2375 e exige
# "Expose daemon on tcp://localhost:2375 without TLS" habilitado. Com essa
# opção desligada (padrão, e o correto por segurança) ele falha ao listar
# containers, sai com código 0 e entra em restart loop (~a cada 7s).
# Impacto de desligar: sem logs agregados dentro do Studio local.
[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
# Equipe fechada: cadastro público desligado. Usuários nascem via admin API
# (apps/web/src/lib/actions/auth.ts -> inviteMember) ou pelo Dashboard.
enable_signup = false

[auth.email]
# ATENÇÃO: não desligar esta chave. No GoTrue local ela vira
# GOTRUE_EXTERNAL_EMAIL_ENABLED=false e derruba o login por SENHA também
# (erro 422 email_provider_disabled). O cadastro público é fechado por
# [auth] enable_signup = false, acima.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
